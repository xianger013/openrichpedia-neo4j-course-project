[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openrichpedia-neo4j-course-project"
version = "1.0.0"
description = "Course project: preprocess an OpenRichpedia subset and visualize it with Neo4j"
requires-python = ">=3.10"
dependencies = ["neo4j>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
